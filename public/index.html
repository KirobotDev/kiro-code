<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiro code</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Code Assistant</h2>
            </div>

            <div class="sidebar-section">
                <button id="loginBtn" class="btn-secondary" style="margin-bottom: 20px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="margin-right: 8px;">
                        <path
                            d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z" />
                    </svg>
                    Connecter Google
                </button>
                <button id="clearBtn" class="btn-secondary">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right: 8px;">
                        <path d="M12 5v14M5 12h14" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Nouvelle conversation
                </button>
            </div>

            <div class="sidebar-section">
                <label class="sidebar-label">Projet</label>
                <button id="selectDirBtn" class="btn-secondary">
                    Sélectionner dossier
                </button>
                <div id="currentDir" class="current-dir"></div>
            </div>

            <div class="sidebar-section" style="flex: 1; overflow-y: auto;">
                <label class="sidebar-label">Historique</label>
                <div id="historyList"></div>
            </div>

            <div class="sidebar-footer">
                <a href="https://github.com/kirobotdev/kiro-code" target="_blank"
                    style="text-decoration: none; display: flex; align-items: center; justify-content: center; opacity: 0.7; transition: opacity 0.2s; margin-bottom: 10px;">
                    <svg height="20" width="20" viewBox="0 0 16 16" fill="white">
                        <path
                            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z">
                        </path>
                    </svg>
                </a>
                <p class="footer-text">Code Assistant<br>avec l'IA</p>
            </div>
        </aside>

        <main class="main-content">
            <div id="chatMessages" class="chat-messages"></div>

            <div class="input-area">
                <div class="input-container">
                    <textarea id="messageInput" class="input-text" placeholder="Posez une question sur votre code..."
                        rows="1"></textarea>

                    <div class="input-footer">
                        <div class="mode-dropdown-container">
                            <button id="modeSelectorBtn" class="mode-selector-btn">
                                <span id="currentModeDisplay">Agent</span>
                                <svg class="chevron-icon" width="10" height="10" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2">
                                    <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                            </button>
                            <div id="modeDropdownMenu" class="mode-dropdown-menu">
                                <div class="mode-option" data-mode="agent">
                                    <div class="mode-option-title">Agent</div>
                                    <div class="mode-option-desc">Peut éditer vos fichiers</div>
                                </div>
                                <div class="mode-option" data-mode="ask">
                                    <div class="mode-option-title">Ask</div>
                                    <div class="mode-option-desc">Réponses textuelles uniquement</div>
                                </div>
                            </div>
                        </div>

                        <div style="flex: 1;"></div>

                        <button id="sendBtn" class="btn-send">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                                <path d="M2 10L18 10M18 10L11 3M18 10L11 17" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="renameModal" class="modal-overlay">
        <div class="modal-content">
            <h3 class="modal-title">Renommer la conversation</h3>
            <input type="text" id="renameInput" class="modal-input" placeholder="Nouveau nom...">
            <div class="modal-footer">
                <button id="cancelRenameBtn" class="btn-modal-secondary">Annuler</button>
                <button id="confirmRenameBtn" class="btn-modal-primary">Confirmer</button>
            </div>
        </div>
    </div>

    <script>
        require('../dist/ui/renderer.js');
    </script>
</body>

</html>
